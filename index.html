<script>
const LB_URL='';// set to the leaderboard backend URL once hosted, e.g. https://xxx.workers.dev
const lbp=document.getElementById('lbp'),lbb=document.getElementById('lbb');
const contb=document.getElementById('contb'),startb=document.getElementById('startb');
function esc(v){return String(v).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')}
function lbShow(rows,msg){lbp.style.display='block';lbp.innerHTML='<div style="color:#7fff00;text-align:center;font-size:1.3em">🏆 LEADERBOARD</div>'+(msg?'<div style="text-align:center;color:#e0aaff;margin:10px">'+esc(msg)+'</div>':'<ol style="margin:6px 0;padding-left:1.6em">'+rows.slice(0,10).map(e=>'<li>'+esc(e.name)+' — ⭐'+(+e.stars|0)+(e.cleared?' 🏁':'')+'</li>').join('')+'</ol>')}
async function lbFetch(){if(!LB_URL)return lbShow([],'Leaderboard offline');lbShow([],'Loading...');
try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),5000);const r=await fetch(LB_URL+'/scores',{signal:ctl.signal});if(!r.ok)throw 0;const d=await r.json();lbShow(Array.isArray(d)?d:[],(Array.isArray(d)&&d.length)?'':'No scores yet!')}catch(e){lbShow([],'Leaderboard offline')}}
async function lbSubmit(name,stars,cleared){if(!LB_URL)return;
try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),5000);await fetch(LB_URL+'/scores',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name.replace(/<[^>]*>/g,'').slice(0,12),stars:Math.max(0,Math.min(200,stars|0)),cleared:!!cleared,date:new Date().toISOString().slice(0,10)}),signal:ctl.signal})}catch(e){}lbFetch()}
lbb.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();lbp.style.display=='block'?lbp.style.display='none':lbFetch()});
lbb.addEventListener('touchstart',e=>e.stopPropagation());
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,S,yOff=0,reservedBottom=0,safeT=0,safeL=0,safeR=0,safeB=0;
function readSafe(){const s=getComputedStyle(document.getElementById('safeprobe'));safeT=parseFloat(s.paddingTop)||0;safeR=parseFloat(s.paddingRight)||0;safeB=parseFloat(s.paddingBottom)||0;safeL=parseFloat(s.paddingLeft)||0}
function rs(){const vv=window.visualViewport;W=c.width=Math.max(1,Math.round(vv&&vv.width?vv.width:innerWidth));H=c.height=Math.max(1,Math.round(vv&&vv.height?vv.height:innerHeight));readSafe();
const pad=document.getElementById('pad');const padOn=pad&&getComputedStyle(pad).display!=='none';
reservedBottom=padOn?Math.max(pad.offsetHeight||0,H<500?86:110):Math.max(safeB,8);
document.documentElement.style.setProperty('--pad-h',reservedBottom+'px');
const playH=Math.max(160,H-reservedBottom);
const portrait=H>W*1.15;const worldW=portrait?Math.min(800,Math.max(520,W/0.68)):800;
S=Math.min(W/worldW,playH/600);if(S<0.32)S=0.32;
yOff=Math.max(0,playH-600*S)}
addEventListener('resize',rs);
addEventListener('orientationchange',()=>setTimeout(rs,80));
if(window.visualViewport){visualViewport.addEventListener('resize',rs);visualViewport.addEventListener('scroll',rs)}
rs();
const k={left:0,right:0,jump:0,smash:0},keyK={left:0,right:0,jump:0,smash:0},padK={left:0,right:0,jump:0,smash:0};
function syncK(){k.left=keyK.left||padK.left;k.right=keyK.right||padK.right;k.jump=keyK.jump||padK.jump;k.smash=keyK.smash||padK.smash}
function clearKeys(){for(const q of ['left','right','jump','smash'])k[q]=keyK[q]=padK[q]=0}
let started=0,ac=null,naming=1,NAME='Jeremiah';
const ni=document.getElementById('ni'),nmD=document.getElementById('nm');
try{const v=localStorage.getItem('smashName');if(v)ni.value=v}catch(e){}
function submitName(){NAME=ni.value.trim().slice(0,12)||'Jeremiah';try{localStorage.setItem('smashName',NAME)}catch(e){}
document.title=NAME+"'s Smash Game";nmD.style.display='none';ni.blur();document.getElementById('pad').style.display='flex';setTimeout(()=>{naming=0;showTitleButtons();rs()},150)}
document.getElementById('go').addEventListener('click',e=>{e.preventDefault();submitName()});
ni.addEventListener('keydown',e=>{e.stopPropagation();if(e.key=='Enter'){e.preventDefault();submitName()}});
ni.addEventListener('keyup',e=>e.stopPropagation());
function snd(f,d,t){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;o.frequency.exponentialRampToValueAtTime(Math.max(40,f/3),ac.currentTime+d);g.gain.value=.15;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function ensureAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}}
const km={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',w:'jump',W:'jump',' ':'smash',x:'smash',X:'smash'};
addEventListener('keydown',e=>{if(naming||e.target===ni)return;if(endS){if((e.key=='Enter'||e.key==' ')&&!e.repeat)onEndButton();e.preventDefault();return}if(!started){e.preventDefault();return}const m=km[e.key];if(m){keyK[m]=1;if(e.key==' ')keyK.jump=1;syncK();e.preventDefault()}});
addEventListener('keyup',e=>{const m=km[e.key];if(m){keyK[m]=0;if(e.key==' ')keyK.jump=0;syncK()}});
document.querySelectorAll('.b').forEach(b=>{const n=b.dataset.k;
b.addEventListener('mousedown',e=>{if(naming||endS||!started)return;e.preventDefault();padK[n]=1;syncK()});
b.addEventListener('mouseup',e=>{padK[n]=0;syncK()});
b.addEventListener('mouseleave',e=>{padK[n]=0;syncK()});
b.addEventListener('contextmenu',e=>e.preventDefault())});
function isUI(el){return el&&el.closest&&el.closest('#nm,#eb,#lbb,#lbp,#contb,#startb,input,button:not(.b)')}
function touchesToPad(ev){padK.left=padK.right=padK.jump=padK.smash=0;if(!naming&&!endS&&started){for(const t of ev.touches){const el=document.elementFromPoint(t.clientX,t.clientY);const b=el&&el.closest&&el.closest('#pad .b');if(b)padK[b.dataset.k]=1}}syncK()}
function onTS(ev){if(isUI(ev.target))return;ev.preventDefault();ensureAudio();touchesToPad(ev)}
function onTM(ev){if(ev.target&&ev.target.closest&&ev.target.closest('#lbp'))return;ev.preventDefault();if(!naming)touchesToPad(ev)}
function onTE(ev){if(!isUI(ev.target))ev.preventDefault();touchesToPad(ev)}
addEventListener('touchstart',onTS,{passive:false});
addEventListener('touchmove',onTM,{passive:false});
addEventListener('touchend',onTE,{passive:false});
addEventListener('touchcancel',onTE,{passive:false});
addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('contextmenu',e=>{if(!isUI(e.target))e.preventDefault()});
c.addEventListener('mousedown',e=>{if(!naming){e.preventDefault();ensureAudio()}});
const LEVELS=[
  {id:1,name:'Backyard',goal:15,robotChance:.35,robotSpeed:.45,maxThings:5,dmg:16,sky0:'#4ca6e0',sky1:'#d4f0a8',ground:'#4caf50',groundDark:'#2e7d32'},
  {id:2,name:'City',goal:22,robotChance:.5,robotSpeed:.7,maxThings:6,dmg:17,sky0:'#5b1a8f',sky1:'#c77dff',ground:'#3cb93c',groundDark:'#2e8b2e'},
  {id:3,name:'Junkyard',goal:30,robotChance:.58,robotSpeed:.95,maxThings:7,dmg:18,sky0:'#5d3310',sky1:'#e8955a',ground:'#6d4c41',groundDark:'#4e342e'},
  {id:4,name:'Robot Factory',goal:38,robotChance:.68,robotSpeed:1.2,maxThings:8,dmg:18,sky0:'#071018',sky1:'#1b6b7a',ground:'#37474f',groundDark:'#263238'},
  {id:5,name:'Boss',goal:45,robotChance:.55,robotSpeed:1.05,maxThings:6,dmg:20,sky0:'#120018',sky1:'#a82848',ground:'#3b0a4e',groundDark:'#1e0528'}
];
function LV(){return LEVELS[level-1]}
const G=480;let power=100,inv=0,endS=null,endAt=0,GOAL=15,level=1,unlocked=1,totalStars=0,introT=0,boss=null,bossWinT=0;
const eb=document.getElementById('eb');
try{const u=parseInt(localStorage.getItem('smashUnlock')||'1',10);if(u>=1&&u<=5)unlocked=u}catch(e){}
function saveUnlock(n){unlocked=Math.max(unlocked,Math.min(5,n|0));try{localStorage.setItem('smashUnlock',String(unlocked))}catch(e){}}
let p={x:200,y:G,vy:0,f:1,sm:0,cd:0},things=[],parts=[],score=0,shake=0,cam=0,t=0,msg='',mt=0;
let buddy={x:120,y:270,spin:0,zap:0,zx:0,zy:0,say:'',sayT:0,cd:240,greet:1,cheer:520};
function addStars(n){score+=n;totalStars+=n}
function spawn(){const lv=LV();const r=Math.random()<lv.robotChance;const spd=lv.robotSpeed*(.85+Math.random()*.3);
things.push({x:cam+800/S*1.2+Math.random()*300+W/S,y:G,r,w:r?60:70,h:r?80:70,ph:Math.random()*6,vx:r?-spd:0})}
function spawnBoss(){boss={x:p.x+420,y:G,hp:8,maxHp:8,hurt:0,fall:0,f:-1,ph:Math.random()*6,w:140,h:200}}
function boom(px,py,col){for(let i=0;i<30;i++){const a=Math.random()*6.28,s=2+Math.random()*7;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,l:50,c:col[i%col.length],st:i%3==0})}}
const words=['SMASH!','BONK!','POW!','WOW!','SUPER!','KABOOM!'];
function hideTitleButtons(){contb.style.display='none';startb.style.display='none';lbb.style.display='none';lbp.style.display='none'}
function showTitleButtons(){if(naming||started){hideTitleButtons();return}
startb.style.display='block';startb.textContent=unlocked>1?'START OVER':'START!';
if(unlocked>1){contb.style.display='block';contb.textContent='CONTINUE (LEVEL '+unlocked+')'}else contb.style.display='none';
lbb.style.display='block'}
function resetBuddy(){buddy.x=p.x-80;buddy.y=p.y-210;buddy.spin=0;buddy.zap=0;buddy.cd=240;buddy.say='';buddy.sayT=0;buddy.greet=1;buddy.cheer=520}
function beginLevel(n,opts){opts=opts||{};level=Math.max(1,Math.min(5,n|0));const lv=LV();GOAL=lv.goal;score=0;power=100;inv=0;endS=null;bossWinT=0;
things=[];parts=[];p.x=200;p.y=G;p.vy=0;p.sm=0;p.cd=10;p.f=1;cam=0;mt=0;shake=0;introT=150;boss=null;clearKeys();resetBuddy();
if(opts.greet){buddy.say="Hi! I'm Robo Buddy! Let's smash!";buddy.sayT=220;buddy.greet=0}
else{buddy.greet=0;buddy.say='Go '+NAME+'!';buddy.sayT=90}
for(let i=0;i<Math.max(3,lv.maxThings-1);i++)spawn();
if(level===5)spawnBoss();
started=1;document.getElementById('pad').style.display='flex';hideTitleButtons();eb.style.display='none';rs()}
function startRun(n){if(naming)return;ensureAudio();totalStars=0;beginLevel(n,{greet:n===1})}
function goTitle(){started=0;endS=null;level=1;GOAL=LEVELS[0].goal;score=0;totalStars=0;boss=null;bossWinT=0;introT=0;power=100;inv=0;
things=[];parts=[];p.x=200;p.y=G;p.vy=0;p.f=1;cam=0;mt=0;shake=0;clearKeys();resetBuddy();
for(let i=0;i<4;i++)spawn();
eb.style.display='none';document.getElementById('pad').style.display=naming?'none':'flex';showTitleButtons();rs()}
function endLevel(kind){endS=kind;mt=0;document.getElementById('pad').style.display='none';endAt=performance.now();clearKeys();
if(kind==='cleared'){saveUnlock(level+1);eb.textContent='NEXT LEVEL';snd(523,.3,'triangle');setTimeout(()=>snd(784,.5,'triangle'),200)}
else if(kind==='final'){saveUnlock(5);lbSubmit(NAME,totalStars,true);eb.textContent='PLAY AGAIN';snd(523,.25,'triangle');setTimeout(()=>snd(659,.25,'triangle'),180);setTimeout(()=>snd(784,.5,'triangle'),360)}
else{lbSubmit(NAME,totalStars,false);eb.textContent='TRY AGAIN';snd(200,.6,'triangle')}
eb.style.display='none';setTimeout(()=>{if(endS)eb.style.display='block'},700);rs()}
function onEndButton(){if(!endS||performance.now()-endAt<700)return;eb.style.display='none';lbp.style.display='none';
if(endS==='cleared'){const n=level+1;endS=null;beginLevel(n,{greet:false})}
else if(endS==='final'){goTitle()}
else{totalStars=Math.max(0,totalStars-score);endS=null;beginLevel(level,{greet:false})}}
eb.addEventListener('click',e=>{e.preventDefault();onEndButton()});eb.addEventListener('touchend',e=>{e.preventDefault();onEndButton()});
startb.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();startRun(1)});
contb.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(unlocked>1)startRun(unlocked)});
startb.addEventListener('touchstart',e=>e.stopPropagation());contb.addEventListener('touchstart',e=>e.stopPropagation());
function followBuddy(){const tx=p.x-p.f*78,ty=p.y-210+Math.sin(t*.08)*10;buddy.x+=(tx-buddy.x)*.14;buddy.y+=(ty-buddy.y)*.14}
function hitBoss(){if(!boss||boss.hp<=0||boss.hurt>0)return false;boss.hp--;boss.hurt=30;addStars(5);shake=16;boom(boss.x,boss.y-120,['#f4c430','#fff','#7cfc00','#9b30d9']);
msg=boss.hp<=0?'KING DOWN!':'POW!';mt=40;snd(180,.3);if(boss.hp<=0){bossWinT=80;snd(523,.4,'triangle')}return true}
function buddyZap(){if(buddy.cd>0){buddy.cd--;return}let best=null,bestD=230;
for(const o of things){if(o.dead)continue;const d=Math.abs(o.x-p.x);if(d<bestD){bestD=d;best=o}}
if(boss&&boss.hp>0){const d=Math.abs(boss.x-p.x);if(d<bestD){bestD=d;best='boss'}}
if(!best){buddy.cd=40;return}
if(best==='boss'){if(hitBoss()){buddy.zap=16;buddy.zx=boss.x;buddy.zy=boss.y-120;buddy.cd=270+Math.floor(Math.random()*30);snd(1400,.08,'square');setTimeout(()=>snd(880,.18,'sawtooth'),40)}else buddy.cd=20;return}
best.dead=1;addStars(best.r?2:1);shake=8;boom(best.x,best.y-best.h/2,best.r?['#ff0','#fff','#7ff']:['#c6f','#a0522d','#ff0']);
msg='ZAP!';mt=28;buddy.zap=16;buddy.zx=best.x;buddy.zy=best.y-best.h/2;buddy.cd=270+Math.floor(Math.random()*30);
snd(1400,.08,'square');setTimeout(()=>snd(880,.18,'sawtooth'),40)}
function updBoss(){if(!boss)return;if(boss.hurt>0)boss.hurt--;if(boss.hp<=0){boss.fall=(boss.fall||0)+7;return}
const dx=p.x-boss.x;boss.f=dx>=0?1:-1;if(Math.abs(dx)>130)boss.x+=Math.sign(dx)*.75;else boss.x+=Math.sin(t*.03)*0.25;

function zapBolt(x1,y1,x2,y2){x.save();x.lineJoin='round';x.lineCap='round';

function bubble(s,px,py){const lines=s.length>22?s.split(/(?<=[.!])\s+/):[s];

x.beginPath();x.moveTo(px-8,by+bh);x.lineTo(px,by+bh+10);x.lineTo(px+8,by+bh);x.closePath();x.fill();x.stroke();
x.fillStyle='#5b1a8f';for(let i=0;i<lines.length;i++)x.fillText(lines[i],px,by+pad+9+i*18);

function drawDecor(){const lv=LV();const i0=Math.floor(cam/200)-1,i1=cam/200+W/S/200+2;

else if(lv.id===2){for(let i=i0;i<i1;i++){x.fillStyle=i%2?'#7b2cbf':'#9d4edd';const bh=150+(i*73%120);x.fillRect(i*200,G-bh-40,150,bh+40);x.fillStyle='#e0aaff';for(let j=0;j<3;j++)x.fillRect(i*200+20+j*42,G-bh-10,22,22)}}
else if(lv.id===3){for(let i=i0;i<i1;i++){x.fillStyle=i%2?'#8d4a2b':'#6b3a22';const bh=90+(i*91%110);x.fillRect(i*200,G-bh,160,bh);x.fillStyle='#c07030';x.fillRect(i*200+20,G-bh+16,28,20);x.fillRect(i*200+90,G-bh+30,34,16);x.fillStyle='#4e342e';x.fillRect(i*200+40,G-30,70,30);x.fillStyle='#bf6b2e';x.fillRect(i*200+50,G-48,50,18)}}
else if(lv.id===4){for(let i=i0;i<i1;i++){x.fillStyle=i%2?'#1b2a34':'#263848';const bh=180+(i*67%140);x.fillRect(i*200,G-bh,150,bh);x.fillStyle='#263238';x.fillRect(i*200+110,G-bh-70,22,70);x.fillStyle=i%2?'#7ffcff':'#ffef00';for(let r=0;r<4;r++)for(let c=0;c<3;c++)x.fillRect(i*200+16+c*42,G-bh+16+r*36,22,16);if((t+i*10)%80<40){x.fillStyle='rgba(180,180,190,.5)';x.beginPath();x.ellipse(i*200+121,G-bh-80-(t%80)*.4,16,10,0,0,7);x.fill()}}}
else{for(let i=i0;i<i1;i++){x.fillStyle=i%2?'#4a1468':'#2a0838';const bh=160+(i*59%100);x.fillRect(i*200,G-bh-20,70,bh+20);x.fillRect(i*200+100,G-bh+20,50,bh-20);x.fillStyle='#f4c430';x.fillRect(i*200+20,G-bh-20,30,10);x.fillStyle='#ff6b8a';for(let j=0;j<2;j++)x.fillRect(i*200+16,G-bh+30+j*50,22,28)}}}

x.fillStyle=lv.ground;x.fillRect(cam-100,G,W/S+400,800);x.fillStyle=lv.groundDark;
if(lv.id===4){for(let i=Math.floor(cam/80);i<cam/80+W/S/80+3;i++){x.fillStyle=i%2?'#ffef00':'#222';x.fillRect(i*80,G,40,12)}}
